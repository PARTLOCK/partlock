<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Товар | PARTLOCK</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container nav-bar">
            <a href="index.html" class="logo">
    <img src="favicon.png" alt="Partlock Logo">PART<span>LOCK</span>
</a>
            <nav class="desktop-nav">
                <a href="catalog.html">Каталог</a>
                <a href="custom-order.html">Під замовлення</a>
                <a href="about.html">Про нас</a>
                <a href="contacts.html">Контакти</a>
            </nav>
        </div>
    </header>

    <main class="container product-page" id="productContainer">
        <div class="breadcrumbs">
            <a href="catalog.html">Каталог</a> / <span id="bcCategory">...</span> / <span id="bcName">...</span>
        </div>

        <div class="product-details-layout">
            <div class="product-image-box">
                <img id="pdImg" src="" alt="Фото товару">
            </div>
            <div class="product-info-box">
                <h1 id="pdName">Завантаження...</h1>
                <p class="pd-oem">OEM: <span id="pdOem">...</span></p>
                
                <div class="pd-specs mt-20">
                    <p><strong>Бренд:</strong> <span id="pdBrand">...</span></p>
                    <p><strong>Категорія:</strong> <span id="pdCategory">...</span></p>
                    <p><strong>Сумісність:</strong> <span id="pdCompatibility">...</span></p>
                    <p><strong>Мінімальне замовлення:</strong> від <span id="pdMinQty">...</span> шт.</p>
                </div>

                <div class="pd-prices mt-20">
                    <h3>Оптові ціни:</h3>
                    <ul id="pdPricesList"></ul>
                </div>

                <div class="mt-20">
                    <button class="btn btn-primary w-100" id="pdAskPriceBtn">Запитати оптову ціну</button>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Запит оптової ціни</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <p><strong>Товар:</strong> <span id="modalProductName"></span></p>
                <p><strong>OEM:</strong> <span id="modalProductOem"></span></p>
                <div class="form-group mt-20">
                    <label for="modalQuantity">Необхідна кількість (шт):</label>
                    <input type="number" id="modalQuantity" min="1">
                </div>
                <div class="modal-buttons mt-20">
                    <button class="btn btn-primary w-100" id="btnTg">Написати в Telegram</button>
                    <button class="btn btn-viber w-100" id="btnViber">Написати у Viber</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
